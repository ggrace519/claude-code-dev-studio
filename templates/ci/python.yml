  python-quality:
    name: Python lint + dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ruff (lint)
        run: pipx run ruff check .
      - name: pip-audit (advisory - flags known-vulnerable deps, does not block)
        continue-on-error: true
        run: |
          if [ -f requirements.txt ]; then
            pipx run pip-audit -r requirements.txt
          else
            pipx run pip-audit .
          fi
