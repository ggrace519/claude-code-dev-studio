version: 2
updates:
  # Keep the actions and the shared ggrace519/.github reusable workflows current. Callers pin
  # those workflows to a release commit SHA, so a new release reaches this repo only through
  # the pull request Dependabot opens here; it bumps the SHA and the version comment together.
  - package-ecosystem: github-actions
    directory: /
    cooldown:
      # The shared ggrace519/.github workflows are our own releases: take them
      # as soon as they are out instead of after the default 3-day cooldown.
      exclude:
        - ggrace519/.github/.github/workflows/promote.yml
        - ggrace519/.github/.github/workflows/release.yml
        - ggrace519/.github/.github/workflows/version.yml
    # Explicit rather than "the default branch", so a default-branch change cannot silently
    # redirect updates onto main.
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns: ["*"]
