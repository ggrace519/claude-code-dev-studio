name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-agents-nix:
    name: Verify agents (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Make verifier executable
        run: chmod +x verify-agents.sh

      - name: Run verify-agents.sh
        run: ./verify-agents.sh

  marketplace-freshness:
    name: Marketplace tree is regenerated
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0   # build-marketplace.py resolves the version from git tags

      - name: Regenerate marketplace
        run: python3 scripts/build-marketplace.py

      - name: Fail on drift
        run: git diff --exit-code -- .claude-plugin plugins

  lint-playbook:
    name: Lint playbook invariants
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run lint-playbook.py
        run: python3 scripts/lint-playbook.py

  routing-eval:
    name: Routing eval (deterministic)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run eval-routing.py (golden prompts)
        run: python3 scripts/eval-routing.py

      - name: Report description-ambiguity pairs (informational)
        run: python3 scripts/eval-routing.py --ambiguity

  python-tests:
    name: Script tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run unittest suite
        run: python3 -m unittest discover -s tests -v

  python-tests-windows:
    name: Script tests (Windows)
    runs-on: windows-latest
    steps:
      # Check out LF, matching what the generators emit — several tests compare
      # generated output against checked-in files. core.autocrlf alone is NOT
      # enough: .gitattributes marks *.md/*.json `text`, and Git converts those
      # to core.eol (native = CRLF on Windows) whatever autocrlf says.
      - name: Check out with LF line endings
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout
        uses: actions/checkout@v5

      # Same suite as the Linux job. The product runs on both platforms, so it
      # is tested on both: each platform runs what applies and skips what does
      # not (bash/deb classes carry sys.platform guards; the PowerShell
      # installer class is Windows-only for the same reason).
      - name: Run unittest suite
        shell: pwsh
        run: python -m unittest discover -s tests -v

  verify-agents-windows:
    name: Verify agents (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run Verify-Agents.ps1
        shell: pwsh
        run: ./Verify-Agents.ps1

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        env:
          SHELLCHECK_OPTS: -e SC1091 -e SC2155
        with:
          scandir: './'
          severity: warning

  psscriptanalyzer:
    name: PSScriptAnalyzer
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error
          if ($results) {
              $results | Format-Table -AutoSize
              Write-Error "PSScriptAnalyzer found $($results.Count) Error-severity issue(s)"
              exit 1
          }
          Write-Host "PSScriptAnalyzer: clean (Error severity)" -ForegroundColor Green
