name: Release

# Merging the develop → main promotion PR is the release (ADR-0022). The shared
# ggrace519/.github release workflow reads the top `## [X.Y.Z] - YYYY-MM-DD`
# section of CHANGELOG.md, tags vX.Y.Z on main and creates the GitHub release
# with that section as its notes. A tag pushed with GITHUB_TOKEN starts no other
# workflow, so the ZIP and package builds are chained here with `needs:` and
# attach their files to that release. On the promotion PR the same check runs
# as a dry run, so a missing or already-tagged version fails before the merge.
# If a build fails after the release exists, "Re-run failed jobs" retries the
# builds only; the tag and release stay.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Tag and release from CHANGELOG.md
    permissions:
      contents: write
    uses: ggrace519/.github/.github/workflows/release.yml@0e67344dbe377d259b4973d7546a08da0864c620 # v1.2.0
    with:
      dry-run: ${{ github.event_name == 'pull_request' }}

  # ---------------------------------------------------------------------------
  # Windows: build ZIP + SHA256 sidecar
  # ---------------------------------------------------------------------------
  build-zip:
    name: Build ZIP (Windows)
    runs-on: windows-latest
    needs: release
    if: github.event_name == 'push' && needs.release.outputs.released == 'true'
    outputs:
      version:    ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve version from the release tag
        id: version
        shell: pwsh
        env:
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          $tag = "$env:TAG"
          if ($tag -notmatch '^v\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
              throw "Tag '$tag' does not match vMAJOR.MINOR.PATCH[-suffix]"
          }
          $prerelease = if ($tag -match '-') { 'true' } else { 'false' }
          "version=$tag"           | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "prerelease=$prerelease" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "version=$tag  prerelease=$prerelease"

      - name: Build release ZIP
        shell: pwsh
        run: ./build-release.ps1 -Version "${{ steps.version.outputs.version }}"

      - name: Verify ZIP + SHA256
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $zip = "dist/ccds-$version.zip"
          $sha = "$zip.sha256"
          if (-not (Test-Path $zip)) { throw "ZIP not found: $zip" }
          if (-not (Test-Path $sha)) { throw "SHA256 sidecar not found: $sha" }
          $actual   = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          $recorded = ((Get-Content $sha -Raw).Split(' ')[0]).Trim().ToLower()
          if ($actual -ne $recorded) { throw "SHA256 mismatch. Recorded=$recorded Actual=$actual" }
          Write-Host "ZIP bytes : $((Get-Item $zip).Length)"
          Write-Host "SHA256    : $actual"

      - name: Upload ZIP artifacts
        uses: actions/upload-artifact@v7
        with:
          name: zip-artifacts
          path: |
            dist/ccds-${{ steps.version.outputs.version }}.zip
            dist/ccds-${{ steps.version.outputs.version }}.zip.sha256

  # ---------------------------------------------------------------------------
  # Linux: build .deb + .rpm via fpm
  # ---------------------------------------------------------------------------
  build-packages:
    name: Build packages (Linux)
    runs-on: ubuntu-latest
    needs: [release, build-zip]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install fpm
        run: |
          sudo apt-get install -y ruby ruby-dev rpm
          sudo gem install fpm --no-document

      - name: Build .deb and .rpm
        run: |
          chmod +x build-release.sh
          ./build-release.sh --version "${{ needs.build-zip.outputs.version }}"

      - name: Verify packages exist
        run: |
          VERSION="${{ needs.build-zip.outputs.version }}"
          VERSION_BARE="${VERSION#v}"
          DEB="dist/ccds_${VERSION_BARE}_all.deb"
          RPM="dist/ccds-${VERSION_BARE}-1.noarch.rpm"
          [[ -f "$DEB" ]] || { echo "ERROR: .deb not found: $DEB"; exit 1; }
          [[ -f "$RPM" ]] || { echo "ERROR: .rpm not found: $RPM"; exit 1; }
          echo "DEB: $(du -h "$DEB" | cut -f1)  $DEB"
          echo "RPM: $(du -h "$RPM" | cut -f1)  $RPM"

      - name: Upload package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: pkg-artifacts
          path: |
            dist/*.deb
            dist/*.rpm

  # ---------------------------------------------------------------------------
  # Publish: attach all artifacts and the install notes to the release
  # ---------------------------------------------------------------------------
  publish:
    name: Attach assets to the GitHub Release
    runs-on: ubuntu-latest
    needs: [release, build-zip, build-packages]
    permissions:
      contents: write
    steps:
      - name: Checkout (for release body template)
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/release-body.md.tmpl
          sparse-checkout-cone-mode: false

      - name: Download ZIP artifacts
        uses: actions/download-artifact@v8
        with:
          name: zip-artifacts
          path: dist/

      - name: Download package artifacts
        uses: actions/download-artifact@v8
        with:
          name: pkg-artifacts
          path: dist/

      - name: List release artifacts
        run: ls -lh dist/

      - name: Render release body from template
        id: body
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.build-zip.outputs.version }}"
          VERSION_BARE="${VERSION#v}"
          DEB="dist/ccds_${VERSION_BARE}_all.deb"
          RPM="dist/ccds-${VERSION_BARE}-1.noarch.rpm"
          ZIP="dist/ccds-${VERSION}.zip"
          for f in "$DEB" "$RPM" "$ZIP"; do
            [[ -f "$f" ]] || { echo "Asset missing: $f" >&2; exit 1; }
          done
          DEB_SHA=$(sha256sum "$DEB" | awk '{print $1}')
          RPM_SHA=$(sha256sum "$RPM" | awk '{print $1}')
          ZIP_SHA=$(sha256sum "$ZIP" | awk '{print $1}')
          REPO_ESCAPED="${{ github.repository }}"
          cp .github/release-body.md.tmpl release-body.md
          sed -i \
            -e "s|__VERSION__|${VERSION}|g" \
            -e "s|__VERSION_BARE__|${VERSION_BARE}|g" \
            -e "s|__REPO__|${REPO_ESCAPED}|g" \
            -e "s|__DEB_SHA__|${DEB_SHA}|g" \
            -e "s|__RPM_SHA__|${RPM_SHA}|g" \
            -e "s|__ZIP_SHA__|${ZIP_SHA}|g" \
            release-body.md
          # Sanity: every placeholder must be resolved.
          if grep -nE '__[A-Z_]+__' release-body.md; then
            echo "Unresolved placeholders in release-body.md" >&2
            exit 1
          fi
          echo "--- rendered release body ---"
          cat release-body.md

      - name: Attach assets and install notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          # --clobber keeps a re-run of this job idempotent.
          gh release upload "$TAG" --clobber \
            dist/ccds-*.zip \
            dist/ccds-*.zip.sha256 \
            dist/ccds_*.deb \
            dist/ccds-*.rpm
          # The release notes are the CHANGELOG.md section; put the install
          # instructions above them, once.
          gh release view "$TAG" --json body --jq .body > changelog-notes.md
          if grep -qF '<!-- ccds-install-notes -->' changelog-notes.md; then
            echo "Install notes already on $TAG."
          else
            {
              echo '<!-- ccds-install-notes -->'
              cat release-body.md
              printf '\n---\n\n'
              cat changelog-notes.md
            } > release-notes.md
            gh release edit "$TAG" --notes-file release-notes.md
          fi
          gh release view "$TAG" --json url,assets --jq '"\(.url)\n\(.assets | map(.name) | join("\n"))"'
