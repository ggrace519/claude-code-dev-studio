name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # claude-code-action fails any run on a pull request a bot opened ("Workflow initiated by
    # non-human actor"), and runs Dependabot triggers get only Dependabot secrets, so
    # CLAUDE_CODE_OAUTH_TOKEN is empty there. Skip both. Bot-opened pull requests are the
    # promotion and changelog roll-up PRs (github-actions[bot] or the release app) and
    # Dependabot's bumps; the promotion's commits were each reviewed in their own PRs.
    # claude[bot] pushing to a person's pull request stays allowed below (allowed_bots).
    if: >-
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.user.type != 'Bot'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # Allow runs initiated by claude[bot] (e.g. when an in-PR fix is pushed
          # by the bot and triggers `synchronize`). Without this the action errors
          # with: "Workflow initiated by non-human actor: claude (type: Bot)".
          allowed_bots: 'claude[bot]'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

